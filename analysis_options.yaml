include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "**/*.gen.dart"
    - "**/*.pb.dart"
    - "**/*.pbgrpc.dart"
    - "**/*.pbjson.dart"
    - "lib/l10n/generated/**"
    - "wear/lib/l10n/generated/**"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false

formatter:
  page_width: 80

dcm:
  extends:
    - recommended
  rules:
    - no-empty-block:
        exclude:
          - test/**
          - "**/test/**"
    - prefer-match-file-name:
        exclude:
          - test/**
          - "**/test/**"
          - lib/src/animations/motion_presets.dart
          - lib/src/colors/colors.dart
          - lib/src/ninja/surfaces/ninja_spotlight.dart
          - lib/src/ninja/surfaces/ninja_timeline_markers.dart
          - lib/src/theme/theme.dart
          - lib/src/typography/typography.dart
          - lib/src/widgets/action_card.dart
          - lib/src/widgets/app_activity_row.dart
          - lib/src/widgets/app_source_badge.dart
          - lib/src/widgets/app_tag.dart
          - lib/src/widgets/buttons/app_button.dart
          - lib/src/widgets/profile/app_profile_stats_strip.dart
          - "**/banner_ad_block.dart"
          - "**/block_action.dart"
          - "**/spacer_block.dart"
          - "**/text_caption_block.dart"
    - prefer-single-widget-per-file: false
    - prefer-returning-shorthands: false
    - prefer-shorthands-with-constructors: false
    - prefer-shorthands-with-enums: false
    - prefer-shorthands-with-static-fields: false
    - prefer-spacing: false
    - prefer-public-exception-classes:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-inferrable-type-arguments:
        exclude:
          - test/**
          - "**/test/**"
          - lib/common/widgets/app_flat_calendar.dart
    - avoid-dynamic:
        exclude:
          - test/**
          - "**/test/**"
          - "**/news_blocks_converter.dart"
          - "**/news_block_map_converter.dart"
          - "**/ical_custom_fields_registry.dart"
          - lib/src/theme/theme.dart
    - match-getter-setter-field-names:
        exclude:
          - lib/tour/app_tour_controller.dart
          - "**/src/ninja/ninja_colors.dart"
    - prefer-correct-callback-field-name:
        exclude:
          - "**/src/colors/colors.dart"
          - "**/src/ninja/ninja_colors.dart"
          - "**/src/widgets/forms/app_input_field.dart"
    - move-variable-closer-to-its-usage:
        exclude:
          - test/**
          - "**/test/**"
          - lib/map/widgets/svg_interactive_map.dart
    - avoid-duplicate-initializers:
        exclude:
          - test/**
          - "**/test/**"
          - lib/map/widgets/svg_interactive_map.dart
    - function-always-returns-same-value:
        exclude:
          - lib/schedule/view/schedule_page.dart
    - dispose-fields:
        exclude:
          - lib/tour/view/app_tour_overlay.dart
    - avoid-undisposed-instances:
        exclude:
          - lib/src/widgets/forms/six_digit_code_input.dart
    - avoid-unsafe-collection-methods:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-default-tostring:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-misused-test-matchers:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-never-passed-parameters:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-duplicate-test-assertions:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-shadowing:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-duplicate-cascades:
        exclude:
          - test/**
          - "**/test/**"
    - prefer-prefixed-global-constants:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-missing-controller:
        exclude:
          - test/**
          - "**/test/**"
    - prefer-correct-json-casts:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-unused-assignment:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-unnecessary-local-late:
        exclude:
          - "**/src/widgets/toast/toast_manager.dart"
    - prefer-null-aware-elements:
        exclude:
          - lib/src/ninja/surfaces/ninja_dialog.dart
          - lib/src/ninja/surfaces/ninja_state_switcher.dart
    - function-always-returns-null:
        exclude:
          - test/**
          - "**/test/**"
    - no-equal-switch-expression-cases:
        exclude:
          - test/**
          - "**/test/**"
          - lib/src/widgets/buttons/app_button.dart
    - avoid-passing-self-as-argument:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-duplicate-constant-values:
        exclude:
          - lib/src/ninja/widgets/ninja_button.dart
          - lib/src/spacing/app_spacing.dart
    - avoid-passing-async-when-sync-expected:
        exclude:
          - test/**
          - "**/test/**"
          - "**/example/**"
    - avoid-unnecessary-futures:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-nullable-interpolation:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-missing-enum-constant-in-map:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-unused-parameters:
        exclude:
          - test/**
          - "**/test/**"
          - lib/src/theme/theme.dart
    - avoid-unnecessary-local-variable:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-unnecessary-nullable-parameters:
        exclude:
          - test/**
          - "**/test/**"
    - avoid-unnecessary-nullable-return-type:
        exclude:
          - test/**
          - "**/test/**"
    - prefer-parentheses-with-if-null:
        exclude:
          - test/**
          - "**/test/**"
  exclude:
    all:
      - "**/*.freezed.dart"
      - "**/*.g.dart"
      - "**/*.gen.dart"
      - "**/*.pb.dart"
      - "**/*.pbgrpc.dart"
      - "**/*.pbjson.dart"
      - "lib/l10n/generated/**"
      - "wear/lib/l10n/generated/**"
