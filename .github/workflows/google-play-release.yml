name: Google Play Internal Release

on:
  workflow_run:
    workflows:
      - Beta Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: false
        default: ''
      update_icon_only:
        description: Update store icon without uploading a bundle
        required: false
        type: boolean
        default: false
      submit_icon_for_review:
        description: Submit the store icon change for review
        required: false
        type: boolean
        default: false

permissions:
  attestations: read
  contents: read

concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'workflow_run' ||
      github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: beta
    env:
      PACKAGE_NAME: ninja.mirea.mireaapp

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify publishing configuration
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: >-
            ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_RTU_MIREA_APP }}
        shell: bash
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            printf 'Missing Google Play service account configuration\n' >&2
            exit 1
          fi

      - name: Resolve beta release
        if: ${{ inputs.update_icon_only != true }}
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'A release tag is required for a manual bundle upload\n' >&2
            exit 1
          else
            tag="$(
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq "[.[] | select(.prerelease and .target_commitish == \"$RELEASE_SHA\")][0].tag_name // empty"
            )"
          fi
          if [[ -z "$tag" ]]; then
            printf 'Matching beta release is unavailable\n' >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'available=true\n' >> "$GITHUB_OUTPUT"

      - name: Download signed Android bundle
        if: ${{ steps.release.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/play-release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.aab' \
            --dir "$RUNNER_TEMP/play-release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'SHA256SUMS' \
            --dir "$RUNNER_TEMP/play-release"
          mapfile -t bundles < <(
            find "$RUNNER_TEMP/play-release" -maxdepth 1 -type f -name '*.aab' -print
          )
          if (( ${#bundles[@]} != 1 )); then
            printf 'Expected one signed Android bundle, found %s\n' "${#bundles[@]}" >&2
            exit 1
          fi
          bundle="${bundles[0]}"
          unzip -t "$bundle" >/dev/null
          (
            cd "$RUNNER_TEMP/play-release"
            sha256sum --check --ignore-missing SHA256SUMS
          )
          gh attestation verify "$bundle" --repo "$GITHUB_REPOSITORY"
          printf 'ANDROID_BUNDLE=%s\n' "$bundle" >> "$GITHUB_ENV"

      - name: Prepare Google Play credentials
        if: ${{ steps.release.outputs.available == 'true' || (github.event_name == 'workflow_dispatch' && inputs.update_icon_only == true) }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: >-
            ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_RTU_MIREA_APP }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"].strip()
          try:
              credentials = json.loads(raw)
          except json.JSONDecodeError:
              credentials = json.loads(base64.b64decode(raw, validate=True))
          required = {"client_email", "private_key", "project_id"}
          if not required.issubset(credentials):
              raise SystemExit("Invalid Google Play service account configuration")
          client_email = credentials["client_email"]
          if not isinstance(client_email, str) or not client_email.endswith(".iam.gserviceaccount.com"):
              raise SystemExit("Invalid Google Play service account email")
          print(f"Google Play service account: {client_email}")
          destination = Path(os.environ["RUNNER_TEMP"]) / "google-play-service-account.json"
          destination.write_text(json.dumps(credentials), encoding="utf-8")
          destination.chmod(0o600)
          PY

      - name: Upload beta to Google Play
        if: ${{ steps.release.outputs.available == 'true' }}
        shell: bash
        run: |
          python3 -m unittest discover -s test/tool -p google_play_internal_release_test.py
          python3 tool/google_play_internal_release.py \
            --credentials "$RUNNER_TEMP/google-play-service-account.json" \
            --bundle "$ANDROID_BUNDLE" \
            --package-name "$PACKAGE_NAME" \
            --release-name "${{ steps.release.outputs.tag }}"

      - name: Update Google Play store icon
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_icon_only == true }}
        env:
          SUBMIT_ICON_FOR_REVIEW: ${{ inputs.submit_icon_for_review }}
        shell: bash
        run: |
          python3 -m unittest discover -s test/tool -p google_play_store_icon_test.py
          arguments=(
            --credentials "$RUNNER_TEMP/google-play-service-account.json"
            --icon android/app/src/main/ic_launcher-playstore.png
            --package-name "$PACKAGE_NAME"
          )
          if [[ "$SUBMIT_ICON_FOR_REVIEW" == "true" ]]; then
            arguments+=(--submit-for-review)
          fi
          python3 tool/google_play_store_icon.py "${arguments[@]}"

      - name: Remove Google Play credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/google-play-service-account.json"
