name: Shorebird iOS Release

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Existing iOS artifact run ID
        required: false
        type: string
        default: ''
      verify_build_number:
        description: Existing App Store build number
        required: false
        type: string
        default: ''
      verify_marketing_version:
        description: Existing App Store marketing version
        required: false
        type: string
        default: ''
      verify_release_status:
        description: Check App Store release state without building or uploading
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: shorebird-ios-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.artifact_run_id == '' && inputs.verify_build_number == '' && inputs.verify_marketing_version == '' && !inputs.verify_release_status }}
    runs-on: macos-15
    timeout-minutes: 60
    environment: beta
    defaults:
      run:
        shell: bash
    env:
      APPLE_TEAM_ID: J935XAGDUL
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      IOS_APP_BUNDLE_ID: pro.oniel.it.university
      IOS_WIDGET_BUNDLE_ID: pro.oniel.it.university.homewidget

    steps:
      - name: Verify release configuration
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_WIDGET_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          UNIVERSITY_CONFIG_JSON: ${{ vars.UNIVERSITY_CONFIG_JSON }}
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          required=(
            SHOREBIRD_TOKEN
            BUILD_CERTIFICATE_BASE64
            BUILD_PROVISION_PROFILE_BASE64
            BUILD_WIDGET_PROVISION_PROFILE_BASE64
            P12_PASSWORD
            KEYCHAIN_PASSWORD
            UNIVERSITY_CONFIG_JSON
            FIREBASE_CONFIG_JSON
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing iOS release configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Verify Xcode toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.3"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install pinned Shorebird
        run: |
          shorebird_dir="$RUNNER_TEMP/shorebird-sdk"
          shorebird_revision="5ac7f9a9a5c4a5e66a958e608da0f73e34a3d6bb"
          mkdir "$shorebird_dir"
          git -C "$shorebird_dir" init
          git -C "$shorebird_dir" remote add origin https://github.com/shorebirdtech/shorebird.git
          git -C "$shorebird_dir" fetch --depth 1 origin "$shorebird_revision"
          git -C "$shorebird_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$shorebird_dir" rev-parse HEAD)" = "$shorebird_revision"
          printf '%s\n' "$shorebird_dir/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Verify source
        run: |
          flutter analyze lib test
          flutter test
          python3 -m unittest discover -s test/tool -p app_store_build_status_test.py

      - name: Configure iOS signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_WIDGET_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/build_certificate.p12"
          app_profile_path="$RUNNER_TEMP/app.mobileprovision"
          widget_profile_path="$RUNNER_TEMP/widget.mobileprovision"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          profiles_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          export_options_path="$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$profiles_directory"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          def decode_base64(name: str, path: str) -> None:
              Path(path).write_bytes(
                  base64.b64decode(os.environ[name].strip(), validate=True)
              )

          runner_temp = os.environ["RUNNER_TEMP"]
          decode_base64("BUILD_CERTIFICATE_BASE64", runner_temp + "/build_certificate.p12")
          decode_base64("BUILD_PROVISION_PROFILE_BASE64", runner_temp + "/app.mobileprovision")
          decode_base64("BUILD_WIDGET_PROVISION_PROFILE_BASE64", runner_temp + "/widget.mobileprovision")
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          if ! security find-identity -v -p codesigning "$keychain_path" | grep -q 'Apple Distribution'; then
            printf 'Apple Distribution identity is unavailable\n' >&2
            exit 1
          fi
          security cms -D -i "$app_profile_path" > "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$widget_profile_path" > "$RUNNER_TEMP/widget-profile.plist"
          python3 - <<'PY'
          import datetime
          import os
          import plistlib

          def profile(path: str, bundle_id: str) -> str:
              with open(path, "rb") as source:
                  data = plistlib.load(source)
              expiration = data["ExpirationDate"]
              now = datetime.datetime.now(datetime.timezone.utc)
              if expiration.tzinfo is None:
                  expiration = expiration.replace(tzinfo=datetime.timezone.utc)
              if expiration <= now:
                  raise SystemExit(f"Provisioning profile expired for {bundle_id}")
              application_identifier = data["Entitlements"]["application-identifier"]
              if not application_identifier.endswith("." + bundle_id):
                  raise SystemExit(f"Provisioning profile bundle mismatch for {bundle_id}")
              if os.environ["APPLE_TEAM_ID"] not in data.get("TeamIdentifier", []):
                  raise SystemExit(f"Provisioning profile team mismatch for {bundle_id}")
              return data["Name"]

          runner_temp = os.environ["RUNNER_TEMP"]
          app_bundle = os.environ["IOS_APP_BUNDLE_ID"]
          widget_bundle = os.environ["IOS_WIDGET_BUNDLE_ID"]
          export_options = {
              "manageAppVersionAndBuildNumber": False,
              "method": "app-store",
              "provisioningProfiles": {
                  app_bundle: profile(runner_temp + "/app-profile.plist", app_bundle),
                  widget_bundle: profile(runner_temp + "/widget-profile.plist", widget_bundle),
              },
              "signingCertificate": "Apple Distribution",
              "signingStyle": "manual",
              "teamID": os.environ["APPLE_TEAM_ID"],
          }
          with open(runner_temp + "/ExportOptions.plist", "wb") as target:
              plistlib.dump(export_options, target)
          PY
          cp "$app_profile_path" "$profiles_directory/app.mobileprovision"
          cp "$widget_profile_path" "$profiles_directory/widget.mobileprovision"
          test -s "$export_options_path"

      - name: Configure university
        env:
          UNIVERSITY_CONFIG_JSON: ${{ vars.UNIVERSITY_CONFIG_JSON }}
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
        run: |
          printf '%s\n' "$UNIVERSITY_CONFIG_JSON" > "$RUNNER_TEMP/university.json"
          printf '%s\n' "$FIREBASE_CONFIG_JSON" > "$RUNNER_TEMP/firebase.json"
          dart run tool/configure_university.dart \
            --config "$RUNNER_TEMP/university.json"

      - name: Release iOS
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/dart-symbols"
          build_number="$(python3 -c 'from datetime import datetime, timezone; now = datetime.now(timezone.utc); epoch = datetime(2020, 1, 1, tzinfo=timezone.utc); print(f"{(now - epoch).days}.{now.hour}.{now.minute}")')"
          if [[ ! "$build_number" =~ ^[0-9]{1,4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            printf 'Invalid iOS build number\n' >&2
            exit 1
          fi
          shorebird release ios \
            --flutter-version 3.44.2 \
            --export-options-plist=${{ runner.temp }}/ExportOptions.plist \
            --target lib/main/main_production.dart \
            --obfuscate \
            --split-debug-info="$RUNNER_TEMP/dart-symbols" \
            --no-confirm \
            -- \
            --dart-define-from-file=${{ runner.temp }}/university.json \
            --dart-define-from-file=${{ runner.temp }}/firebase.json \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} \
            --build-number="$build_number"

      - name: Encrypt release symbols
        run: |
          symbols_root="$RUNNER_TEMP/release-symbols"
          symbols_archive="$RUNNER_TEMP/ios-release-symbols.tar.gz"
          mkdir -p "$symbols_root/dart" "$symbols_root/ios" build/release-symbols
          cp -R "$RUNNER_TEMP/dart-symbols/." "$symbols_root/dart/"
          if [[ -d build/ios/archive/Runner.xcarchive/dSYMs ]]; then
            cp -R build/ios/archive/Runner.xcarchive/dSYMs/. "$symbols_root/ios/"
          fi
          tar -czf "$symbols_archive" -C "$symbols_root" .
          openssl smime -encrypt -binary -aes256 -outform DER \
            -in "$symbols_archive" \
            -out build/release-symbols/ios-release-symbols.cms \
            tool/release_symbols_public.pem

      - name: Upload iOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-shorebird-release
          path: |
            build/ios/ipa/*.ipa
            build/release-symbols/*.cms
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing and configuration material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/widget.mobileprovision"
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          rm -f "$RUNNER_TEMP/app.mobileprovision"
          rm -f "$RUNNER_TEMP/widget.mobileprovision"
          rm -f "$RUNNER_TEMP/app-profile.plist"
          rm -f "$RUNNER_TEMP/widget-profile.plist"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$RUNNER_TEMP/university.json"
          rm -f "$RUNNER_TEMP/firebase.json"

  publish:
    needs: release
    if: ${{ always() && (needs.release.result == 'success' || inputs.artifact_run_id != '' || inputs.verify_build_number != '' || inputs.verify_marketing_version != '' || inputs.verify_release_status) }}
    runs-on: macos-15
    timeout-minutes: 30
    environment: beta
    env:
      IOS_APP_BUNDLE_ID: pro.oniel.it.university
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify publishing configuration
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          VERIFY_RELEASE_STATUS: ${{ inputs.verify_release_status }}
          VERIFY_BUILD_NUMBER: ${{ inputs.verify_build_number }}
          VERIFY_MARKETING_VERSION: ${{ inputs.verify_marketing_version }}
        run: |
          required=(
            APPSTORE_API_KEY_ID
            APPSTORE_API_ISSUER_ID
            APPSTORE_API_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Missing TestFlight configuration: %s\n' "$name" >&2
              exit 1
            fi
          done
          if [[ -n "$ARTIFACT_RUN_ID" && ! "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]; then
            printf 'Invalid iOS artifact run ID\n' >&2
            exit 1
          fi
          if [[ -n "$VERIFY_BUILD_NUMBER" && ! "$VERIFY_BUILD_NUMBER" =~ ^[0-9]{1,4}(\.[0-9]{1,2}){0,2}$ ]]; then
            printf 'Invalid App Store build number\n' >&2
            exit 1
          fi
          if [[ -n "$VERIFY_BUILD_NUMBER" && ! "$VERIFY_MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            printf 'Invalid App Store marketing version\n' >&2
            exit 1
          fi
          if [[ -z "$VERIFY_BUILD_NUMBER" && -n "$VERIFY_MARKETING_VERSION" ]]; then
            printf 'App Store build number is required for verification\n' >&2
            exit 1
          fi
          if [[ "$VERIFY_RELEASE_STATUS" == 'true' && -z "$VERIFY_BUILD_NUMBER" ]]; then
            printf 'App Store build number is required for release status\n' >&2
            exit 1
          fi
          if [[ -n "$ARTIFACT_RUN_ID" && -n "$VERIFY_BUILD_NUMBER" ]]; then
            printf 'Artifact recovery and build verification are mutually exclusive\n' >&2
            exit 1
          fi

      - name: Download iOS artifact
        if: ${{ inputs.artifact_run_id == '' && inputs.verify_build_number == '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ios-shorebird-release
          path: ${{ runner.temp }}/ios

      - name: Download existing iOS artifact
        if: ${{ inputs.artifact_run_id != '' && inputs.verify_build_number == '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ios-shorebird-release
          path: ${{ runner.temp }}/ios
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Configure App Store Connect key
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          private_key = os.environ["APPSTORE_API_PRIVATE_KEY"].strip()
          if "BEGIN PRIVATE KEY" not in private_key:
              encoded_key = "".join(private_key.split())
              private_key = base64.b64decode(encoded_key, validate=True).decode("utf-8")
          private_key = private_key.replace("\\n", "\n")
          if "BEGIN PRIVATE KEY" not in private_key:
              raise SystemExit("Invalid App Store Connect private key")
          key_path = Path.home() / ".appstoreconnect" / "private_keys" / f"AuthKey_{os.environ['APPSTORE_API_KEY_ID']}.p8"
          key_path.write_text(private_key.rstrip() + "\n", encoding="utf-8")
          key_path.chmod(0o600)
          PY

      - name: Upload iOS beta to TestFlight
        if: ${{ inputs.verify_build_number == '' }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          ipa="$(find "$RUNNER_TEMP/ios" -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa" ]]; then
            printf 'Signed iOS artifact is unavailable\n' >&2
            exit 1
          fi
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Verify TestFlight processing
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          VERIFY_BUILD_NUMBER: ${{ inputs.verify_build_number }}
          VERIFY_MARKETING_VERSION: ${{ inputs.verify_marketing_version }}
          VERIFY_RELEASE_STATUS: ${{ inputs.verify_release_status }}
        run: |
          status_args=()
          if [[ "$VERIFY_RELEASE_STATUS" == 'true' ]]; then
            status_args+=(--release-status)
          fi
          build_number="$VERIFY_BUILD_NUMBER"
          marketing_version="$VERIFY_MARKETING_VERSION"
          if [[ -z "$build_number" ]]; then
            ipa="$(find "$RUNNER_TEMP/ios" -type f -name '*.ipa' -print -quit)"
            if [[ -z "$ipa" ]]; then
              printf 'Signed iOS artifact is unavailable\n' >&2
              exit 1
            fi
            extraction_root="$RUNNER_TEMP/app-store-verification"
            unzip -q "$ipa" -d "$extraction_root"
            app_plist="$(find "$extraction_root/Payload" -maxdepth 2 -type f -path '*.app/Info.plist' -print -quit)"
            if [[ -z "$app_plist" ]]; then
              printf 'Application metadata is unavailable in the iOS artifact\n' >&2
              exit 1
            fi
            build_number="$(plutil -extract CFBundleVersion raw -o - "$app_plist")"
            marketing_version="$(plutil -extract CFBundleShortVersionString raw -o - "$app_plist")"
          fi
          python3 tool/app_store_build_status.py \
            --bundle-id "$IOS_APP_BUNDLE_ID" \
            --build-number "$build_number" \
            --marketing-version "$marketing_version" \
            --key-id "$APPSTORE_API_KEY_ID" \
            --issuer-id "$APPSTORE_API_ISSUER_ID" \
            --private-key "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8" \
            --timeout 1200 \
            --interval 30 \
            "${status_args[@]}"

      - name: Remove App Store Connect key
        if: always()
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8"
