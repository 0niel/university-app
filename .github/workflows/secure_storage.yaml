name: secure_storage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".fvmrc"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter_package.yml"
      - "packages/storage/secure_storage/**"
      - ".github/workflows/secure_storage.yaml"
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/flutter_package.yml
    with:
      coverage_excludes: "**/*.g.dart"
      working_directory: packages/storage/secure_storage
