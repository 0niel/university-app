name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Plan checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.plan.outputs.flutter }}
      wear: ${{ steps.plan.outputs.wear }}
      content-fetcher: ${{ steps.plan.outputs.content-fetcher }}
      release-tools: ${{ steps.plan.outputs.release-tools }}
      edge-functions: ${{ steps.plan.outputs.edge-functions }}
      supabase-migrations: ${{ steps.plan.outputs.supabase-migrations }}
      schedule-fetcher: ${{ steps.plan.outputs.schedule-fetcher }}
      has-packages: ${{ steps.plan.outputs.has-packages }}
      package-matrix: ${{ steps.plan.outputs.package-matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install planner dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Plan checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tool/ci_plan.py --base "$BASE_SHA"

  release-tools:
    needs: changes
    if: needs.changes.outputs.release-tools == 'true'
    name: Release tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install planner dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Test release tools
        run: python -m unittest discover -s test/tool -p '*_test.py'
      - name: Test showcase seed
        run: node --test scripts/build_showcase_seed.test.mjs

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Verify private native boundary
        run: dart tool/verify_private_native_boundary.dart --history

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        run: |
          for directory in lib test tool tools; do
            if [[ "$directory" == tools ]]; then
              for source in tools/*.dart; do
                dart analyze --fatal-warnings "$source"
              done
            else
              dart analyze --fatal-warnings "$directory"
            fi
          done

      - name: Test
        run: flutter test --no-pub

  wear:
    needs: changes
    if: needs.changes.outputs.wear == 'true'
    name: Wear
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wear

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-warnings

      - name: Test
        run: flutter test --no-pub

  content-fetcher:
    needs: changes
    if: needs.changes.outputs.content-fetcher == 'true'
    name: Content fetcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/social_media_fetcher

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: tools/social_media_fetcher/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  workspace-packages:
    name: Packages ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.has-packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.package-matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Install workspace dependencies
        run: flutter pub get
      - name: Analyze and test packages
        env:
          CI_PACKAGES: ${{ toJSON(matrix.packages) }}
        run: python tool/ci_packages.py

  schedule-fetcher:
    name: Schedule fetcher
    needs: changes
    if: needs.changes.outputs.schedule-fetcher == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/schedule_fetcher
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-warnings
      - name: Test
        run: dart test

  edge-functions:
    needs: changes
    if: needs.changes.outputs.edge-functions == 'true'
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: lts
          cache: true

      - name: Check formatting
        run: deno fmt --check supabase/functions/ingest supabase/functions/miniapp-notify

      - name: Type-check
        run: >-
          deno check --frozen --config=supabase/functions/deno.json
          supabase/functions/ingest/index.ts
          supabase/functions/miniapp-notify/index.ts

      - name: Lint
        run: deno lint supabase/functions/ingest supabase/functions/miniapp-notify

      - name: Test
        run: >-
          deno test --frozen --config=supabase/functions/deno.json
          supabase/functions/ingest
          supabase/functions/miniapp-notify

  supabase-migrations:
    needs: changes
    if: needs.changes.outputs.supabase-migrations == 'true'
    name: Supabase migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Replay migrations
        run: supabase db reset

      - name: Verify database security contracts
        shell: bash
        run: |
          failed_contracts=()
          for contract in supabase/tests/*_contract.sql; do
            if ! psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
              --set ON_ERROR_STOP=1 \
              --file "$contract"; then
              failed_contracts+=("$contract")
            fi
          done
          if (( ${#failed_contracts[@]} > 0 )); then
            printf 'Failed contract: %s\n' "${failed_contracts[@]}"
            exit 1
          fi

      - name: Lint database
        run: supabase db lint --local --level warning

  checks:
    name: CI checks
    if: always()
    needs:
      - changes
      - release-tools
      - flutter
      - wear
      - content-fetcher
      - workspace-packages
      - schedule-fetcher
      - edge-functions
      - supabase-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .changes.result == "success" and
            all(.[]; .result == "success" or .result == "skipped")
          '
