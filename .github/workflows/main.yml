name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Verify private native boundary
        run: dart tool/verify_private_native_boundary.dart --history

      - name: Install dependencies
        run: flutter pub get

      - name: Install Wear dependencies
        working-directory: wear
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        run: dart analyze --fatal-warnings

      - name: Test
        run: flutter test

  wear:
    name: Wear
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wear

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-warnings

      - name: Test
        run: flutter test

  content-fetcher:
    name: Content fetcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/social_media_fetcher

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: tools/social_media_fetcher/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  workspace-packages:
    name: Package ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: discourse_api_client
            codegen: true
            test-command: dart test
          - package: campus_repository
            codegen: false
            test-command: flutter test
          - package: news_repository
            codegen: true
            test-command: dart test
          - package: study_groups_repository
            codegen: true
            test-command: dart test
          - package: news_blocks_ui
            codegen: false
            test-command: flutter test
          - package: web_oauth_interceptor_client
            codegen: false
            test-command: flutter test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Generate package code
        if: matrix.codegen
        working-directory: packages/${{ matrix.package }}
        run: dart run build_runner build

      - name: Test package
        working-directory: packages/${{ matrix.package }}
        run: ${{ matrix.test-command }}

  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: lts
          cache: true

      - name: Check formatting
        run: deno fmt --check supabase/functions/ingest

      - name: Type-check
        run: >-
          deno check --frozen --config=supabase/functions/deno.json
          supabase/functions/ingest/index.ts

      - name: Lint
        run: deno lint supabase/functions/ingest

      - name: Test
        run: >-
          deno test --frozen --config=supabase/functions/deno.json
          supabase/functions/ingest

  supabase-migrations:
    name: Supabase migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Replay migrations
        run: supabase db reset

      - name: Verify database security contracts
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --set ON_ERROR_STOP=1
          --file supabase/tests/security_regressions_contract.sql

      - name: Lint database
        run: supabase db lint --local --level warning
