name: Sync MIREA schedule

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schedule-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      vars.SCHEDULE_INGEST_URL != '' &&
      vars.SCHEDULE_ORGANIZATION_ID == 'mirea' &&
      vars.SCHEDULE_SOURCE_BASE_URL != ''
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        working-directory: tools/schedule_fetcher
        run: dart pub get

      - name: Sync schedule
        working-directory: tools/schedule_fetcher
        env:
          SCHEDULE_INGEST_URL: ${{ vars.SCHEDULE_INGEST_URL }}
          SCHEDULE_ORGANIZATION_ID: ${{ vars.SCHEDULE_ORGANIZATION_ID }}
          SCHEDULE_INGEST_KEY: ${{ secrets.SCHEDULE_INGEST_KEY }}
          SCHEDULE_SOURCE_AUTHORIZATION: ${{ secrets.SCHEDULE_SOURCE_AUTHORIZATION }}
          SCHEDULE_SOURCE_BASE_URL: ${{ vars.SCHEDULE_SOURCE_BASE_URL }}
        shell: pwsh
        run: |
          $arguments = @(
            'run',
            'bin/sync_mirea_schedule.dart',
            '--schedule-base-url',
            $env:SCHEDULE_SOURCE_BASE_URL,
            '--fetch-concurrency',
            '16',
            '--batch-size',
            '8'
          )
          & dart @arguments
          if ($LASTEXITCODE -ne 0) {
            Start-Sleep -Seconds 20
            & dart @arguments
          }
          exit $LASTEXITCODE
