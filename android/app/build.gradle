plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.21'
    id 'dev.flutter.flutter-gradle-plugin'
}

def googleServicesFiles = fileTree(projectDir) {
    include 'google-services.json', 'src/**/google-services.json'
}
if (!project.hasProperty('disableGoogleServices') && !googleServicesFiles.isEmpty()) {
    apply plugin: 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

def tenantProperties = new Properties()
def tenantPropertiesFile = rootProject.file('tenant.properties')
if (tenantPropertiesFile.exists()) {
    tenantPropertiesFile.withReader('UTF-8') { reader ->
        tenantProperties.load(reader)
    }
}
def tenantAppName = tenantProperties.getProperty('APP_DISPLAY_NAME') ?: 'Ninja Mirea'
def tenantDeepLinkScheme = tenantProperties.getProperty('APP_DEEP_LINK_SCHEME') ?: 'mireaninja'
def tenantWebHost = tenantProperties.getProperty('APP_WEB_HOST') ?: 'mirea.ninja'
def tenantWebPathPrefix = tenantProperties.getProperty('APP_WEB_PATH_PREFIX') ?: '/app'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseStoreFile = keystoreProperties['storeFile']
    ? file(keystoreProperties['storeFile'])
    : null
def hasReleaseSigning = releaseStoreFile?.isFile()
    && ['keyAlias', 'keyPassword', 'storePassword'].every {
        keystoreProperties[it]?.toString()?.trim()
    }
gradle.taskGraph.whenReady { taskGraph ->
    def buildsProductionRelease = taskGraph.allTasks.any {
        it.name.toLowerCase().contains('productionrelease')
    }
    if (buildsProductionRelease && !hasReleaseSigning) {
        throw new GradleException('Production release signing is not configured')
    }
}

android {
    namespace "ninja.mirea.mireaapp"
    compileSdk 37
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "ninja.mirea.mireaapp"
        minSdk 26
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        manifestPlaceholders = [
            appName: tenantAppName,
            deepLinkScheme: tenantDeepLinkScheme,
            webAppHost: tenantWebHost,
            webAppPathPrefix: tenantWebPathPrefix,
        ]
    }
    
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile releaseStoreFile
            storePassword keystoreProperties['storePassword']
        }
    }

    flavorDimensions "default"
    productFlavors {
        development {
            dimension "default"
            manifestPlaceholders.appName = "${tenantAppName} [DEV]"
        }
        production {
            dimension "default"
            manifestPlaceholders.appName = tenantAppName
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            signingConfig hasReleaseSigning
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.4.8"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "com.android.support:multidex:2.0.1"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.3.21"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation project(':native-feature-api')
    if (findProject(':nfc-pass-private') != null) {
        implementation project(':nfc-pass-private')
    }

    implementation "androidx.constraintlayout:constraintlayout:2.2.1"

    implementation "androidx.work:work-runtime-ktx:2.10.0"
    implementation "androidx.work:work-runtime:2.10.0"

    implementation "androidx.compose.ui:ui:1.7.8"
    implementation "androidx.compose.ui:ui-tooling-preview:1.7.8"
    implementation "androidx.compose.material:material:1.12.0"
    implementation "androidx.compose.ui:ui-tooling:1.7.8"
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.7.8"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.7.8"

    implementation "androidx.glance:glance:1.1.1"
    implementation "androidx.glance:glance-appwidget:1.1.1"

    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "com.google.android.gms:play-services-ads:24.0.0"
    implementation "com.android.billingclient:billing:8.3.0"
}
