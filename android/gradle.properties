org.gradle.jvmargs=-Xmx4g
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
android.enableJetifier=true
kotlin.jvm.target.validation.mode=IGNORE
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# AGP 8.x R8 "optimized resource shrinking" requires non-final R IDs, which we
# keep final (above). Use the legacy resource shrinker so release builds work
# without flipping ID finality (which some deps rely on).
android.r8.optimizedResourceShrinking=false
android.overridePathCheck=true
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.configureondemand=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Artifact downloads on this network die when parallelised, so they are
# serialised (org.gradle.parallel=false above) and given room. Do NOT pin
# systemProp.https.protocols here: forcing TLSv1.3 makes the plugin portal
# handshake fail, and Gradle reports that as "plugin not found".
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
