pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        // Fallback mirror for networks that cannot reach the plugin portal.
        maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin') }
        gradlePluginPortal()
    }

    plugins {
        id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '9.2.1' apply false
    id "com.android.library" version '9.2.1' apply false
    id "org.jetbrains.kotlin.android" version "2.3.21" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
    id "org.jetbrains.kotlin.plugin.serialization" version "2.3.21" apply false
}

include ":app"
include ":native-feature-api"
project(":native-feature-api").projectDir = file("native_feature_api")

def privateNfcModuleDir = providers.gradleProperty("privateNfcModuleDir")
    .map { file(it) }
    .getOrElse(file("private/nfc-pass-android"))
def requirePrivateNfcModule = providers.gradleProperty("requirePrivateNfcModule")
    .map { it.toBoolean() }
    .getOrElse(false)

if (privateNfcModuleDir.isDirectory()) {
    include ":nfc-pass-private"
    project(":nfc-pass-private").projectDir = privateNfcModuleDir
} else if (requirePrivateNfcModule) {
    throw new GradleException("Required private NFC module is missing")
}
