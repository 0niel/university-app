<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" font-family="Geist, system-ui, -apple-system, sans-serif" role="img" aria-label="Сервисный апп: прокси по service-role вызывает внутреннюю edge-функцию">
  <defs>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa0a6"/>
    </marker>
    <filter id="softS" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <line x1="186" y1="74" x2="352" y2="74" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrowS)"/>

  <rect x="34" y="46" width="150" height="56" rx="12" fill="#7c5cff" filter="url(#softS)"/>
  <text x="109" y="79" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Прокси</text>

  <rect x="356" y="42" width="270" height="64" rx="12" fill="#6b7280" filter="url(#softS)"/>
  <text x="491" y="70" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">miniapp-svc-&lt;slug&gt;</text>
  <text x="491" y="89" text-anchor="middle" fill="#eef0f2" font-size="11">edge-функция платформы</text>

  <rect x="224" y="52" width="92" height="22" rx="11" fill="#efeaff"/>
  <text x="270" y="67" text-anchor="middle" fill="#5a3ec8" font-size="12" font-weight="600">service-role</text>

  <rect x="120" y="134" width="520" height="48" rx="12" fill="#f5f3ff" stroke="#e0d9ff" stroke-width="1.5"/>
  <text x="380" y="163" text-anchor="middle" fill="#4b4b57" font-size="12.5"><tspan font-family="Geist Mono, ui-monospace, monospace" fill="#5a3ec8">source_kind = 'service'</tspan> → вызов по slug, без SSRF-проверок</text>
</svg>
