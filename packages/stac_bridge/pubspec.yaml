name: stac_bridge
description: Stac (BDUI) runtime bridge - app_ui widget parsers, custom actions and the secure proxy network layer for mini apps
version: 0.2.0
publish_to: none
environment:
  sdk: ^3.10.0
  flutter: ^3.24.0
resolution: workspace
dependencies:
  app_ui:
    path: ../app_ui
  collection: ^1.19.1
  dio: ^5.9.0
  # Pure-Dart, IO-free expression parser/evaluator (jsep-style). Powers the
  # mini-app logic layer: {{ }} bindings, appIf/appForEach control flow and
  # setState expressions. Chosen over template_expressions (discontinued, ships
  # crypto/random/JSON-path with no sandbox) because the evaluation context is
  # the only capability surface — we curate exactly what authors can call.
  expressions: ^0.2.5
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  share_plus: ^13.1.0
  stac: ^1.5.0
  stac_framework: ^1.0.0
  url_launcher: ^6.1.12
dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
