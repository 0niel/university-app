name: network_location_client
description: >-
  Wi-Fi positioning client: scans nearby access points and resolves a
  position via an MLS-compatible geolocation service (BeaconDB).
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.8.0

resolution: workspace
dependencies:
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  http: ^1.2.0
  json_annotation: ^4.12.0
  wifi_scan: ^0.4.1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.0
  very_good_analysis: 10.3.0
