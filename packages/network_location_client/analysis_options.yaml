include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"

linter:
  rules:
    public_member_api_docs: false

dcm:
  extends:
    - recommended
  rules:
    - prefer-correct-callback-field-name:
        exclude:
          - lib/src/network_location_client.dart
    - prefer-shorthands-with-enums:
        exclude:
          - lib/src/network_location_client.dart
  exclude:
    all:
      - "**/*.freezed.dart"
      - "**/*.g.dart"
