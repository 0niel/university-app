name: app_ui
description: A UI Toolkit for University App
version: 0.2.0+1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ^3.24.0

resolution: workspace
dependencies:
  cached_network_image: ^3.2.0
  calendar_date_picker2: ^3.0.0
  collection: ^1.19.1
  enough_platform_widgets: ^1.1.1
  extended_image: ^10.0.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_cache_manager: ^3.4.1
  flutter_platform_widgets: ^10.0.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.5
  hugeicons: ^1.1.5
  intl: ^0.20.2
  open_filex: ^4.4.0
  photo_view: ^0.15.0
  smooth_sheets: ^1.0.2

dev_dependencies:
  build_runner:
  flutter_gen_runner:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: 10.3.0

flutter_gen:
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true

  output: lib/src/generated/
  line_length: 80

  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true

  assets:
    - assets/maps/objects.json
    - assets/images/
    - assets/icons/
    - assets/icons/hugeicons/
    - assets/maps/v-78/
    - assets/maps/s-20/
    - assets/maps/mp-1/
    
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata/Literata-Variable.ttf
        - asset: assets/fonts/Literata/Literata-Italic-Variable.ttf
          style: italic
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest/Onest-Bold.ttf
          weight: 700
        - asset: assets/fonts/Onest/Onest-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope/Manrope-ExtraBold.ttf
          weight: 800
