include: ../../../analysis_options.yaml

linter:
  rules:
    public_member_api_docs: false

dcm:
  rules:
    - avoid-passing-async-when-sync-expected:
        exclude:
          - lib/main.dart
analyzer:
  exclude:
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
