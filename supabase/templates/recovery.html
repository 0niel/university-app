<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0F0F0F;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#1C1C1C;border-radius:20px;overflow:hidden;">
        <tr>
          <td style="padding:32px 32px 8px 32px;">
            <div style="display:inline-block;width:44px;height:44px;line-height:44px;text-align:center;font-size:24px;background:#A45CFF;border-radius:13px;">🔑</div>
            <h1 style="margin:20px 0 0 0;color:#FFFFFF;font-size:22px;font-weight:800;letter-spacing:-0.4px;">Сброс пароля</h1>
            <p style="margin:6px 0 0 0;color:#A0A0A0;font-size:14px;line-height:20px;">Введи этот код в приложении, чтобы задать новый пароль.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px;">
            <div style="background:#262626;border-radius:14px;padding:18px;text-align:center;color:#FFFFFF;font-size:34px;font-weight:800;letter-spacing:10px;font-family:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 32px 32px;">
            <p style="margin:0;color:#8A8A8A;font-size:13px;line-height:19px;">Код действует ограниченное время. Если ты не запрашивал сброс пароля, проигнорируй это письмо — твой пароль останется прежним.</p>
            <p style="margin:20px 0 0 0;color:#5A5A5A;font-size:12px;line-height:18px;">Приложение университета</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
