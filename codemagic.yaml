definitions:
  environment:
    ios_environment: &ios_environment
      flutter: 3.44.2
      xcode: 26.4
      cocoapods: default
      groups:
        - shorebird
        - app_store
        - university
      vars:
        FLUTTER_VERSION: 3.44.2
        BUNDLE_ID: pro.oniel.it.university
        WIDGET_BUNDLE_ID: pro.oniel.it.university.homewidget
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID
  scripts:
    - &verify_environment
      name: Verify release environment
      script: |
        required=(
          SHOREBIRD_TOKEN
          APP_STORE_CONNECT_PRIVATE_KEY
          APP_STORE_CONNECT_KEY_IDENTIFIER
          APP_STORE_CONNECT_ISSUER_ID
          CERTIFICATE_PRIVATE_KEY
          UNIVERSITY_CONFIG_JSON
          FIREBASE_CONFIG_JSON
          SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY
        )
        missing=()
        for name in "${required[@]}"; do
          if [[ -z "${!name:-}" ]]; then
            missing+=("$name")
          fi
        done
        if (( ${#missing[@]} > 0 )); then
          printf 'Missing Codemagic configuration: %s\n' "${missing[*]}" >&2
          exit 1
        fi
        configured_flutter="$(python3 -c 'import json; print(json.load(open(".fvmrc", encoding="utf-8"))["flutter"])')"
        if [[ "$configured_flutter" != "$FLUTTER_VERSION" ]]; then
          printf 'Flutter version mismatch: .fvmrc=%s workflow=%s\n' "$configured_flutter" "$FLUTTER_VERSION" >&2
          exit 1
        fi
    - &install_shorebird
      name: Install pinned Shorebird
      script: |
        shorebird_dir="$CM_BUILD_DIR/.shorebird-sdk"
        shorebird_revision="5ac7f9a9a5c4a5e66a958e608da0f73e34a3d6bb"
        mkdir "$shorebird_dir"
        git -C "$shorebird_dir" init
        git -C "$shorebird_dir" remote add origin https://github.com/shorebirdtech/shorebird.git
        git -C "$shorebird_dir" fetch --depth 1 origin "$shorebird_revision"
        git -C "$shorebird_dir" checkout --detach FETCH_HEAD
        test "$(git -C "$shorebird_dir" rev-parse HEAD)" = "$shorebird_revision"
        echo "PATH=$shorebird_dir/bin:$PATH" >> "$CM_ENV"
    - &install_dependencies
      name: Install dependencies
      script: flutter pub get
    - &generate_code
      name: Generate code
      script: dart run build_runner build
    - &verify_source
      name: Verify source
      script: |
        flutter analyze
        flutter test
    - &configure_university
      name: Configure university
      script: |
        printf '%s\n' "$UNIVERSITY_CONFIG_JSON" > "$CM_BUILD_DIR/.ci-university.json"
        printf '%s\n' "$FIREBASE_CONFIG_JSON" > "$CM_BUILD_DIR/.ci-firebase.json"
        dart run tool/configure_university.dart --config "$CM_BUILD_DIR/.ci-university.json"
    - &fetch_signing_files
      name: Fetch signing files
      script: |
        signing_args=(
          --type IOS_APP_STORE
          --create
          --platform IOS
          --issuer-id "$APP_STORE_CONNECT_ISSUER_ID"
          --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER"
          --private-key "$APP_STORE_CONNECT_PRIVATE_KEY"
        )
        app-store-connect fetch-signing-files "$BUNDLE_ID" "${signing_args[@]}"
        app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" "${signing_args[@]}"
    - &configure_signing
      name: Configure code signing
      script: |
        keychain initialize
        keychain add-certificates
        xcode-project use-profiles --custom-export-options='{"manageAppVersionAndBuildNumber":false}'
    - &cleanup_configuration
      name: Remove generated configuration
      script: |
        rm -f "$CM_BUILD_DIR/.ci-university.json"
        rm -f "$CM_BUILD_DIR/.ci-firebase.json"

workflows:
  ios-beta-release:
    name: iOS beta release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *ios_environment
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
      cancel_previous_builds: false
    scripts:
      - *verify_environment
      - *install_shorebird
      - *install_dependencies
      - *generate_code
      - *verify_source
      - *configure_university
      - *fetch_signing_files
      - *configure_signing
      - name: Prepare release version
        script: |
          source_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          build_name="${source_version%%+*}"
          if [[ -z "$build_name" ]]; then
            printf 'Missing version in pubspec.yaml\n' >&2
            exit 1
          fi
          echo "BUILD_NAME=$build_name" >> "$CM_ENV"
      - name: Release iOS beta
        script: |
          shorebird release ios \
            --flutter-version="$FLUTTER_VERSION" \
            --export-options-plist="$HOME/export_options.plist" \
            --target=lib/main/main_production.dart \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --obfuscate \
            --split-debug-info="$CM_BUILD_DIR/build/dart-symbols" \
            --no-confirm \
            -- \
            --dart-define-from-file="$CM_BUILD_DIR/.ci-university.json" \
            --dart-define-from-file="$CM_BUILD_DIR/.ci-firebase.json" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Encrypt release symbols
        script: |
          symbols_root="$CM_BUILD_DIR/build/release-symbols-plain"
          symbols_archive="$CM_BUILD_DIR/build/ios-release-symbols.tar.gz"
          mkdir -p "$symbols_root/dart" "$symbols_root/ios" "$CM_BUILD_DIR/build/release-symbols"
          cp -R "$CM_BUILD_DIR/build/dart-symbols/." "$symbols_root/dart/"
          if [[ -d "$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive/dSYMs" ]]; then
            cp -R "$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive/dSYMs/." "$symbols_root/ios/"
          fi
          tar -czf "$symbols_archive" -C "$symbols_root" .
          openssl smime -encrypt -binary -aes256 -outform DER \
            -in "$symbols_archive" \
            -out "$CM_BUILD_DIR/build/release-symbols/ios-release-symbols.cms" \
            "$CM_BUILD_DIR/tool/release_symbols_public.pem"
          rm -rf "$symbols_root" "$symbols_archive" "$CM_BUILD_DIR/build/dart-symbols"
      - *cleanup_configuration
    artifacts:
      - build/ios/ipa/*.ipa
      - build/release-symbols/*.cms
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  ios-patch:
    name: iOS patch
    instance_type: mac_mini_m2
    max_build_duration: 60
    inputs:
      release_version:
        description: Shorebird release version
    environment:
      <<: *ios_environment
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - *verify_environment
      - *install_shorebird
      - *install_dependencies
      - *generate_code
      - *verify_source
      - *configure_university
      - *fetch_signing_files
      - *configure_signing
      - name: Patch iOS
        script: |
          shorebird patch ios \
            --release-version=${{ inputs.release_version }} \
            --export-options-plist="$HOME/export_options.plist" \
            --target=lib/main/main_production.dart \
            --split-debug-info="$CM_BUILD_DIR/build/dart-symbols" \
            --no-confirm \
            -- \
            --dart-define-from-file="$CM_BUILD_DIR/.ci-university.json" \
            --dart-define-from-file="$CM_BUILD_DIR/.ci-firebase.json" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Encrypt patch symbols
        script: |
          symbols_root="$CM_BUILD_DIR/build/release-symbols-plain"
          symbols_archive="$CM_BUILD_DIR/build/ios-patch-symbols.tar.gz"
          mkdir -p "$symbols_root/dart" "$CM_BUILD_DIR/build/release-symbols"
          cp -R "$CM_BUILD_DIR/build/dart-symbols/." "$symbols_root/dart/"
          tar -czf "$symbols_archive" -C "$symbols_root" .
          openssl smime -encrypt -binary -aes256 -outform DER \
            -in "$symbols_archive" \
            -out "$CM_BUILD_DIR/build/release-symbols/ios-patch-symbols.cms" \
            "$CM_BUILD_DIR/tool/release_symbols_public.pem"
          rm -rf "$symbols_root" "$symbols_archive" "$CM_BUILD_DIR/build/dart-symbols"
      - *cleanup_configuration
    artifacts:
      - build/ios/ipa/*.ipa
      - build/release-symbols/*.cms
